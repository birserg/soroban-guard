name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the job only reads the repo.
permissions:
  contents: read

# Cancel superseded runs on rapid pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Pinned by SHA (tags noted alongside): floating tags let a
      # compromised upstream release run unreviewed code in our pipeline.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check:ci
      - run: pnpm test
