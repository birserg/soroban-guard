name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the job only reads the repo.
permissions:
  contents: read

# Cancel superseded runs on rapid pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Pinned by SHA (tags noted alongside): floating tags let a
      # compromised upstream release run unreviewed code in our pipeline.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check:ci
      - run: pnpm test
